services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spectralreader-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/huggingface-cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - API_BASE_URL=http://localhost:8000
      - CORS_ORIGINS=*
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_CACHE_DIR=/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
